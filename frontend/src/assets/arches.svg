<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" fill="none" aria-hidden="true">
  <!-- Left arch: rises from bottom-left, peaks at top-center-left, descends to center -->
  <path
    d="M4 44 Q4 4 20 4 Q36 4 36 44"
    stroke="#FFC72C"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Right arch: rises from center, peaks at top-center-right, descends to bottom-right -->
  <path
    d="M28 44 Q28 4 44 4 Q60 4 60 44"
    stroke="#FFC72C"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
  />
</svg>
