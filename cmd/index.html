<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's Order Controller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="p-4">
    <div class="container">
        <h1 class="text-center text-warning mb-4">McDonald's Order Controller</h1>

        <div class="d-flex gap-2 justify-content-center flex-wrap mb-4">
            <button class="btn btn-success" hx-post="/orders/normal" hx-swap="none" hx-on::after-request="refreshStatus()">New Normal Order</button>
            <button class="btn btn-warning" hx-post="/orders/vip" hx-swap="none" hx-on::after-request="refreshStatus()">New VIP Order</button>
            <button class="btn btn-primary" hx-post="/bots" hx-swap="none" hx-on::after-request="refreshStatus()">+ Add Bot</button>
            <button class="btn btn-danger" hx-delete="/bots" hx-swap="none" hx-on::after-request="refreshStatus()">- Remove Bot</button>
        </div>

        <div class="row g-3">
            <div class="col-md-4">
                <div class="card"><div class="card-body"><h5 class="card-title text-secondary">Bots</h5><div id="bots-list"></div></div></div>
            </div>
            <div class="col-md-4">
                <div class="card"><div class="card-body"><h5 class="card-title text-secondary">Pending Orders</h5><div id="pending-list"></div></div></div>
            </div>
            <div class="col-md-4">
                <div class="card"><div class="card-body"><h5 class="card-title text-secondary">Completed Orders</h5><div id="completed-list"></div></div></div>
            </div>
        </div>

        <p id="timestamp" class="text-center text-muted mt-3"></p>
    </div>

    <script>
        function refreshStatus() {
            fetch('/status').then(r => r.json()).then(data => {
                document.getElementById('bots-list').innerHTML = data.bots.length === 0
                    ? '<p class="text-muted">No bots</p>'
                    : data.bots.map(b => `<div class="d-flex justify-content-between align-items-center mb-2"><span>Bot #${b.id}</span><span>${b.current_order_id ? `<small class="text-muted me-2">Order #${b.current_order_id} (${b.remaining_seconds}s)</small>` : ''}<span class="badge bg-${b.status === 'PROCESSING' ? 'primary' : 'secondary'}">${b.status}</span></span></div>`).join('');

                document.getElementById('pending-list').innerHTML = data.pending.length === 0
                    ? '<p class="text-muted">No pending orders</p>'
                    : data.pending.map(o => `<div class="d-flex justify-content-between align-items-center mb-2"><span>Order #${o.id}</span><span class="badge bg-${o.type === 'VIP' ? 'warning' : 'success'}">${o.type}</span></div>`).join('');

                document.getElementById('completed-list').innerHTML = data.completed.length === 0
                    ? '<p class="text-muted">No completed orders</p>'
                    : data.completed.map(o => `<div class="d-flex justify-content-between align-items-center mb-2"><span>Order #${o.id}</span><span class="badge bg-${o.type === 'VIP' ? 'warning' : 'success'}">${o.type}</span></div>`).join('');

                document.getElementById('timestamp').textContent = 'Last updated: ' + data.timestamp;
            });
        }
        refreshStatus();
        setInterval(refreshStatus, 1000);
    </script>
</body>
</html>
