name: backend-verify-result

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Build → Test → Simulate → Verify result.txt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Build (install dependencies)
        run: bash ./script/build.sh

      - name: Run unit tests
        run: bash ./script/test.sh

      - name: Run CLI simulation
        env:
          # Use 3-second processing for CI to keep the job fast
          BOT_PROCESSING_TIME: 3000
        run: bash ./script/run.sh

      - name: Verify result.txt exists and contains timestamps
        run: |
          if [ ! -f result.txt ]; then
            echo "❌ result.txt not found!"
            exit 1
          fi
          if ! grep -qE '\[[0-9]{2}:[0-9]{2}:[0-9]{2}\]' result.txt; then
            echo "❌ result.txt does not contain HH:MM:SS timestamps!"
            exit 1
          fi
          echo "✅ result.txt verified successfully!"
          echo "── Contents ──────────────────────────────"
          cat result.txt
          echo "──────────────────────────────────────────"

      - name: Upload result.txt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-txt
          path: result.txt
