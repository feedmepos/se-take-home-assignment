name: Main Workflow (Staging Deployment)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json
        
    - name: Install Backend Dependencies
      run: go mod tidy
      
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install
      
    - name: Build Backend
      run: go build -o order-controller ./cmd/api/main.go
      
    - name: Build Frontend (Next.js)
      working-directory: ./frontend
      run: npm run build
      
    - name: Run Backend Tests
      run: go test ./... -v
      
    - name: Run Frontend Tests with Coverage
      working-directory: ./frontend
      run: |
        npm run test:coverage -- --coverageReporters="text-summary" > coverage-summary.txt
        cat coverage-summary.txt
        
    - name: Check Frontend Coverage threshold (85%)
      working-directory: ./frontend
      run: |
        COVERAGE=$(grep "Lines" coverage-summary.txt | awk '{print $3}' | sed 's/%//')
        echo "Current Frontend Coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 85" | bc -l) )); then
          echo "Coverage is below 85%"
          exit 1
        fi
        echo "Coverage check passed!"
    
    - name: Deploy Frontend to Vercel (Staging)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./frontend
        vercel-args: '--prod'
