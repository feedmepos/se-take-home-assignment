name: Development Workflow

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.9'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.19.0'
        
    - name: Install Backend Dependencies
      run: go mod tidy
      
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install --legacy-peer-deps
      
    - name: Build Backend
      run: go build -o order-controller ./cmd/api/main.go
      
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
      
    - name: Run Backend Tests
      run: go test ./... -v
      
    - name: Run Frontend Tests with Coverage
      working-directory: ./frontend
      run: |
        npm run test:coverage -- --coverageReporters="text-summary" > coverage-summary.txt
        cat coverage-summary.txt
        
    - name: Check Frontend Coverage threshold (85%)
      working-directory: ./frontend
      run: |
        COVERAGE=$(grep "Lines" coverage-summary.txt | awk '{print $3}' | sed 's/%//')
        echo "Current Frontend Coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 85" | bc -l) )); then
          echo "Coverage is below 85%"
          exit 1
        fi
        echo "Coverage check passed!"
