name: backend-verify-result

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [golang20260328]
  push:
    branches-ignore:
      - '**tempsave**'

jobs:
  verify-result:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    env:
      GO111MODULE: on
      GOPROXY: https://proxy.golang.org,direct
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        check-latest: true
        
    - name: Verify Go environment
      run: |
        go version
        go env
      
    - name: Make scripts executable
      run: chmod +x scripts/test.sh scripts/build.sh scripts/run.sh
      
    - name: Execute test script
      run: ./scripts/test.sh
      
    - name: Execute build script
      run: ./scripts/build.sh
      
    - name: Execute run script
      run: ./scripts/run.sh
      
    - name: Verify result.txt exists and is not empty
      run: |
        if [ ! -f result.txt ]; then
          echo "ERROR: result.txt does not exist"
          exit 1
        fi
        
        if [ ! -s result.txt ]; then
          echo "ERROR: result.txt is empty"
          exit 1
        fi
        
        # Verify that the result contains timestamps in HH:MM:SS format
        if ! grep -E '[0-9]{2}:[0-9]{2}:[0-9]{2}' result.txt > /dev/null; then
          echo "ERROR: result.txt must contain timestamps in HH:MM:SS format"
          echo "No valid timestamp pattern found in the output"
          exit 1
        fi
        
        echo "SUCCESS: result.txt exists, is not empty, and contains valid timestamps"
        echo "Content of result.txt:"
        cat result.txt